<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to BLIP</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;color:#eaf4ff;background:#101927}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 0,#193d46,transparent 65%)}
main{width:min(100%,520px);background:#152334;border:1px solid #30465c;border-radius:28px;padding:clamp(26px,6vw,48px);box-shadow:0 24px 90px #0005}
.mark{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:#76ead1;color:#102831;font-weight:900;font-size:27px}
.eyebrow{margin:24px 0 8px;letter-spacing:.16em;font-size:12px;color:#76ead1;text-transform:uppercase}h1{font-size:clamp(28px,6vw,36px);line-height:1.2;margin:0 0 18px;letter-spacing:-.04em}p{color:#b3c4d6;margin:12px 0}
progress{width:100%;height:10px;margin:24px 0 8px;accent-color:#76ead1}#detail{font-size:14px;min-height:44px;overflow-wrap:anywhere}
button,a{font:inherit;border-radius:12px;padding:12px 18px;display:inline-block}button{background:#76ead1;color:#102831;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#c4d8ec;text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:3px solid #fff;outline-offset:4px}footer{margin-top:24px;border-top:1px solid #30465c;padding-top:18px;font-size:13px;color:#91a9bf}
</style>
<main>
<div class="mark" aria-hidden="true">B</div><p class="eyebrow">Your device. Ready to create.</p>
<h1>Welcome to BLIP</h1><p>We’re preparing your control interface. Your device will download it, then open it here automatically.</p>
<progress id="progress" aria-label="Interface download"></progress>
<p id="detail" role="status" aria-live="polite">Connecting to your device…</p>
<button id="retry" disabled>Preparing…</button> <a href="/setup">Set up Wi-Fi</a>
<footer>The interface is stored on your BLIP and works offline after installation.</footer>
</main>
<script>
const detail=document.querySelector('#detail'),bar=document.querySelector('#progress'),button=document.querySelector('#retry');
let timer,running=false;
async function status(){const response=await fetch('/api/releases',{cache:'no-store'});if(!response.ok)throw Error('Your device is not ready yet. Retrying shortly.');return response.json()}
function later(fn,ms=1000){clearTimeout(timer);timer=setTimeout(fn,ms)}
async function poll(){
 try{const state=await status();
  if(state.web_ready){detail.textContent='Your interface is ready. Opening…';location.replace('/');return}
  if(state.expected){bar.max=state.expected;bar.value=state.received}else bar.removeAttribute('value');
  if(state.busy){detail.textContent=state.state==='checking'?'Finding the interface for your BLIP…':`Downloading your interface… ${Math.round(100*state.received/Math.max(1,state.expected))}%`;later(poll);return}
  running=false;button.disabled=false;button.textContent='Try again';
  detail.textContent=state.state==='unpublished'?'The interface hasn’t been published for this device yet. We’ll check again shortly.':state.error==='network-unavailable'?'Connect your BLIP to Wi-Fi to download its interface.':'The download could not finish. Your device will try again shortly.';
  later(start,30000);
 }catch(error){detail.textContent=error.message;later(poll,3000)}
}
async function start(){if(running)return;running=true;clearTimeout(timer);button.disabled=true;button.textContent='Preparing…';
 try{const state=await status();if(state.web_ready||state.busy){await poll();return}
  const response=await fetch('/api/releases/first-run',{method:'POST'});if(!response.ok)throw Error('The device is busy. Retrying shortly.');await poll();
 }catch(error){running=false;button.disabled=false;button.textContent='Try again';detail.textContent=error.message;later(start,5000)}
}
button.addEventListener('click',start);start();
</script>
</html>
