<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a1118" />
    <title>BLIP Control</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="BLIP control home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>BLIP</span>
        </a>
        <div class="connection" aria-live="polite">
          <span id="connection-dot" class="connection-dot"></span>
          <span id="connection-status">Offline</span>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="device-name">
          <div>
            <p class="eyebrow">Device control</p>
            <h1 id="device-name">Find your signal.</h1>
            <p id="device-meta" class="device-meta">
              Connect to a BLIP device to build its controls from the live registry.
            </p>
          </div>
          <button id="connect-button" class="primary-button" type="button">Connect</button>
        </section>

        <section class="toolbar" aria-label="Control filters">
          <label class="search-field">
            <span class="sr-only">Search controls</span>
            <span class="search-glyph" aria-hidden="true"></span>
            <input id="control-search" type="search" placeholder="Search controls" />
          </label>
          <label class="toggle-field">
            <input id="show-config" type="checkbox" checked />
            <span>Configuration</span>
          </label>
        </section>

        <p id="notice" class="notice" role="status" hidden></p>
        <section id="controls" class="control-grid" aria-label="Device controls"></section>

        <section class="firmware-panel" aria-labelledby="firmware-heading">
          <div>
            <p class="eyebrow">Maintenance</p>
            <h2 id="firmware-heading">Firmware update</h2>
            <p>Upload a target-matched ESP-IDF application image. The device validates its metadata and SHA-256 before switching OTA slots.</p>
          </div>
          <div class="firmware-form">
            <label>
              <span>Target</span>
              <select id="firmware-target">
                <option value="esp32">ESP32</option>
                <option value="esp32s3">ESP32-S3</option>
                <option value="esp32c6">ESP32-C6</option>
              </select>
            </label>
            <label>
              <span>Application image</span>
              <input id="firmware-file" type="file" accept=".bin,application/octet-stream" />
            </label>
            <button id="firmware-button" class="primary-button" type="button">Upload update</button>
            <p id="firmware-status" class="firmware-status" role="status"></p>
          </div>
        </section>
      </main>
    </div>

    <template id="empty-state-template">
      <article class="empty-state">
        <span class="empty-glyph" aria-hidden="true">⌁</span>
        <h2>No controls yet</h2>
        <p>The live component registry will appear here after a device connects.</p>
      </article>
    </template>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
